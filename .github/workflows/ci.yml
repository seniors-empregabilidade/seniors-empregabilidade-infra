name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Second barrier behind GitHub push protection: fails the PR on any
      # known credential format.
      - name: Scan for secrets
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # Sem backend: validar não precisa de state, e este workflow não recebe
      # credencial da AWS. O plan é sempre manual, com a saída revisada por gente.
      - name: Initialise without backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
